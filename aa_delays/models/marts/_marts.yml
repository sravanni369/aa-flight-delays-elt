version: 2
models:
  - name: dim_airport
    description: One row per airport seen as origin or destination.
    columns:
      - name: airport_code
        data_tests: [unique, not_null]
  - name: dim_route
    description: One row per directed origin-destination pair.
    columns:
      - name: route_key
        data_tests: [unique, not_null]
  - name: dim_date
    description: One row per calendar day with flights. ISO day of week (Monday=1).
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: iso_day_of_week
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5, 6, 7], quote: false}
  - name: fct_flights
    description: Fact table, one row per flight leg. Incremental on _loaded_at, upsert on flight_key.
    columns:
      - name: flight_key
        data_tests: [unique, not_null]
      - name: route_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_route'), field: route_key}
      - name: flight_date
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: origin_airport
        data_tests:
          - relationships:
              arguments: {to: ref('dim_airport'), field: airport_code}
      - name: dest_airport
        data_tests:
          - relationships:
              arguments: {to: ref('dim_airport'), field: airport_code}
  - name: rpt_route_month_delays
    description: Reporting dataset, one row per route per month, for a BI dashboard.
